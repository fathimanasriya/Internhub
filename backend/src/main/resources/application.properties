# ===================================================================
# Student Internship Record System (SIRS) - Application Configuration
# ===================================================================

spring.application.name=sirs-backend
server.port=8080

# -------------------------------------------------------------------
# Database Configuration (Environment Variable Driven)
# Secure defaults: sensitive values are injected via environment
# variables (DB_URL, DB_USERNAME, DB_PASSWORD).
# -------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/internhub?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# -------------------------------------------------------------------
# Spring Data JPA / Hibernate Configuration
# -------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# -------------------------------------------------------------------
# Cross-Origin Resource Sharing (CORS)
# Allows the React frontend running on Vite (default port 5173) to communicate
# -------------------------------------------------------------------
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# -------------------------------------------------------------------
# SpringDoc OpenAPI / Swagger UI Documentation
# Accessible at: http://localhost:8080/swagger-ui.html
# -------------------------------------------------------------------
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
